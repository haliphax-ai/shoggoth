name: Check out and set up
description: Checks out repo, installs ripgrep and npm deps

inputs:
  token:
    description: alternative GitHub token
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check out repo
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.token }}
    - name: Set up node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install deps
      run: npm ci
      shell: bash
